function poll(){timer=setInterval(()=>{if(!busy&&!polling)sync();},2000);}
async function sync(){polling=true;try{if(Date.now()-started>2700000){clearInterval(timer);throw Error('45분 연결이 끝났습니다. 페이지를 다시 열어 주세요.');}const d=await db('');if(!d)throw Error('수업방이 종료되었습니다.');await render(d);msg('수업방 연결됨');}catch(e){state=null;fail(e);lock();}finally{polling=false;}}
function activityUrl(raw){try{const u=new URL(raw);return ['https:','http:'].includes(u.protocol)&&!u.username&&!u.password?u.href:'';}catch{return '';}}
function show(d){state=d;const url=d.step===2?activityUrl(d.question):'';$('activityLinkBox').hidden=!url;if(url)$('activityLink').href=url;else $('activityLink').removeAttribute('href');const item=d.step===4?['수업 완료','모든 수업 단계를 마쳤습니다.']:stages[d.step];$('title').textContent=item[0];$('instruction').textContent=item[1];}
function openLesson(){ $('setup').hidden=true;$('lesson').classList.remove('hidden');}
async function action(fn){if(busy||polling)return;busy=true;lock();try{await fn();}catch(e){fail(e);const status=$('status').textContent; if($('confirmed'))$('confirmed').textContent=status; if($('gate'))$('gate').textContent=status;}finally{busy=false;lock();}}
let lastBeat=0,displayName='',choiceStamp='';
function options(d,own){const list=d.step===3?(d.quiz?.choices||[]):[];const selected=own?.rev===d.rev?own.choice:undefined;const stamp=JSON.stringify([d.rev,list,selected]);$('ack').hidden=!!list.length;if(stamp!==choiceStamp){choiceStamp=stamp;$('answerChoices').replaceChildren(...list.concat(d.step===3&&d.question?['잘 모르겠어요']:[]).map((text,i)=>{const b=document.createElement('button');b.type='button';const value=i===list.length?0:i+1;b.textContent=value?`${value}번 · ${text}`:text;b.setAttribute('aria-pressed',String(selected===value));b.onclick=()=>action(()=>submit(value));return b;}));}}

function lock(){const own=state?.acks?.[uid];$('answerChoices').querySelectorAll('button').forEach(b=>b.disabled=busy||!state||(own?.rev===state.rev&&(!state.quiz?.choices?.length||Number.isInteger(own.choice)))); $('ack').disabled=busy||!state||state.step>=4||(state.step===3&&!state.question)||state.acks?.[uid]?.rev===state.rev; }
async function render(d){show(d);const own=d.acks?.[uid];if(!own||Date.now()-lastBeat>15000){const rev=own?.rev||0;await db('acks/'+uid,'PUT',{...own,rev,displayName,seen:{'.sv':'timestamp'}});lastBeat=Date.now();} options(d,own); $('prompt').hidden=d.step!==3||!d.question;$('prompt').textContent=d.question||'';$('confirmed').textContent=d.step===4?'수업이 완료되었습니다.':d.step===3&&!d.question?'교사가 문항을 보내기를 기다려 주세요.':own?.rev===d.rev?(own.choice===0?'✓ 잘 모르겠어요를 보냈어요.':own.choice?'✓ '+own.choice+'번 응답을 보냈어요.':'✓ 확인을 보냈어요. 기다려 주세요.'):d.quiz?.choices?.length&&d.step===3?'누르면 바로 제출돼요. 선택지를 하나 골라 주세요.':'내용을 확인한 뒤 눌러 주세요.';lock();}
$('connect').onclick=async()=>{ $('connect').disabled=true;try{room=$('room').value.trim();if(!/^[a-f0-9]{32}$/.test(room))throw Error('32자리 수업방 코드를 확인하세요.');displayName=$('displayName').value.trim();if(!displayName)throw Error('이름이나 별명을 입력하세요.');await login();const d=await db('');if(!d)throw Error('수업방이 없거나 종료되었습니다.');await render(d);openLesson();msg('수업방 연결됨');poll();}catch(e){state=null;fail(e);$('connect').disabled=false;}};
async function submit(choice){const rev=state.rev;const d=await db('');if(!d||d.rev!==rev||(d.step===3&&!d.question)||d.step>=4)throw Error('신호가 바뀌었습니다. 새 신호를 확인해 주세요.');const choices=d.step===3?(d.quiz?.choices||[]):[];if(!(choice===0&&d.step===3)&&(choices.length?(!Number.isInteger(choice)||choice<1||choice>choices.length):choice!==undefined))throw Error('선택지를 다시 확인하세요.');if(d.acks?.[uid]?.rev===rev&&(!choices.length||Number.isInteger(d.acks[uid].choice))){await render(d);return;}const record={rev,displayName,...(choice===undefined?{}:{choice})};await db('acks/'+uid,'PUT',{...record,seen:{'.sv':'timestamp'}});lastBeat=Date.now();(d.acks??={})[uid]=record;await render(d);}
$('ack').onclick=()=>action(()=>submit());
const pipApi=window.documentPictureInPicture;
if(pipApi){$('pip').hidden=false;}else{$('pipNote').textContent='이 브라우저에서는 작은 창 띄우기를 지원하지 않아요. 현재 화면에서 수업을 이어가 주세요.';}
$('pip').onclick=async()=>{
 if(pipWindow){pipWindow.close();return;}
 const lesson=$('lesson'),parent=lesson.parentNode,anchor=lesson.nextSibling;
 $('pip').disabled=true;
 try{
  const w=await pipApi.requestWindow({width:390,height:430});
  pipWindow=w;
  w.addEventListener('pagehide',()=>{if(pipWindow!==w)return;parent.insertBefore(lesson,anchor);pipWindow=null;$('pipHome').hidden=true;$('pip').textContent='작은 창으로 띄우기';},{once:true});
  w.document.title='CUE FLOW · 학생용';w.document.documentElement.lang='ko';
  w.document.head.append(document.querySelector('style').cloneNode(true));
  w.document.body.classList.add('compact');
  const shell=w.document.createElement('main');w.document.body.append(shell);shell.append(lesson);
  $('pipHome').hidden=false;$('pip').textContent='원래 창으로 돌아가기';$('pipNote').textContent='';
 }catch{$('pipNote').textContent='작은 창을 열지 못했어요. 현재 화면에서 수업을 이어가 주세요.';}
 finally{$('pip').disabled=false;}
};
$('leave').onclick=()=>action(async()=>{await db('acks/'+uid,'DELETE');clearInterval(timer);state=null;if(pipWindow)pipWindow.close();$('lesson').classList.add('hidden');$('setup').hidden=false;$('connect').disabled=false;msg('수업방에서 나왔습니다.');});
</script></body></html>
