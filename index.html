<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUE FLOW · 학생용</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#172d4a;font-family:system-ui,'Nanum Gothic',sans-serif;line-height:1.6}main{max-width:850px;margin:auto;padding:26px}header{padding:24px;background:#183d70;color:white;border-radius:16px}section{padding:22px;background:white;border-radius:16px;margin:18px 0;border:1px solid #cfdbeb}h1{margin:0;font-size:27px}h2{font-size:20px}textarea,input{width:100%;font:inherit;padding:12px;border:1px solid #aebed4;border-radius:8px}textarea{height:125px}button{font:inherit;padding:13px 18px;border-radius:9px;border:1px solid #a5b9d4;background:#fff;color:#183d70;cursor:pointer;margin:5px}button:hover{background:#e6effc}button:disabled{opacity:.5;cursor:default}.primary{background:#205da8;color:white}.steps{display:grid;grid-template-columns:1fr 1fr}.active{background:#183d70;color:white}.signal{background:#e6efff;border:3px solid #336bb4;padding:24px;border-radius:14px}.signal h2{font-size:30px;margin:0}.muted{font-size:13px;color:#50647e}.status{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;background:#fff2d6;border-radius:8px}code{word-break:break-all}li{margin:7px 0}.hidden{display:none}button:focus-visible{outline:3px solid #be7800;outline-offset:3px}@media(max-width:500px){main{padding:12px}.steps{grid-template-columns:1fr}}[hidden]{display:none!important}.question{white-space:pre-wrap;overflow-wrap:anywhere}.compact header,.compact .muted,.compact #connection{display:none}.compact main{max-width:420px;padding:8px}.compact section{margin:0;padding:8px}.compact .signal{padding:10px}.compact .signal h2{font-size:19px}.compact button{padding:8px 10px}.compact #compact{position:sticky;top:0;z-index:1}.primary:not(:disabled):hover{background:#17477f}.steps{padding-left:24px}.steps .active{padding:4px 8px;border-radius:6px}textarea{resize:vertical}
:root{--forest:#213d34;--ink:#1c342d;--paper:#f6f2e9;--line:#d8dfd2;--lime:#d6ed9a;--soft:#edf1e7}body{background:var(--paper);color:var(--ink);font-family:system-ui,'Apple SD Gothic Neo','Nanum Gothic',sans-serif}main{max-width:940px;padding:24px 20px 34px}header{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:22px 30px;min-height:168px;border-radius:26px;background:var(--forest);color:white}header h1{font-size:clamp(34px,6vw,64px);font-weight:850;letter-spacing:-.065em;line-height:1;margin:10px 0}header p{margin:0;color:#e1ebdd;font-size:14px}.eyebrow{display:inline-block;color:var(--lime);font-size:12px;letter-spacing:.1em;font-weight:800}.cover-art{flex:0 1 280px;width:39%;max-height:170px}section{border:1px solid var(--line);background:#fffdf8;border-radius:22px;padding:20px;margin:14px 0}#connection{padding:0;border:0;background:none}.status{background:var(--soft);border-radius:12px}.signal{background:var(--soft);border:0;border-left:5px solid #638365;padding:18px;border-radius:14px}.signal h2{font-size:clamp(21px,4vw,32px)}.signal p{margin:7px 0}.muted{color:#465c51}textarea,input{border-color:#98a99e;background:white;color:var(--ink)}button{color:var(--ink);border-color:#9bab9e;border-radius:12px;font-weight:700}button:hover{background:var(--soft)}button.primary{background:var(--forest);color:white}button.primary:not(:disabled):hover{background:#365a49}button:focus-visible{outline:3px solid #97513c;outline-offset:3px}.steps{gap:10px;margin:14px 0}.steps button,.steps button.active{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:95px;padding:13px 16px;background:#f5f6ed;color:var(--ink);font-size:19px;border:1px solid var(--line)}.steps button:not(:disabled):hover{border-color:#385646;background:#e5edda}.steps button.active{background:var(--forest);color:white;border-color:var(--forest);opacity:1}.steps button:disabled:not(.active){background:#efeee7;color:#526259;opacity:1}.steps button span{display:inline-block;font-size:12px;margin-bottom:4px;border-radius:99px;background:#e4eadb;padding:1px 8px;color:var(--ink)}.steps button.active span{background:var(--lime)}.roombar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px}.roombar strong{font-size:13px}.roombar code{padding:5px 8px;border-radius:8px;background:var(--soft)}#counts{margin-bottom:0}#gate{margin-top:4px}#editor{background:#f3f5eb;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}#editor h2:first-child{margin-top:0}#close,#leave{font-size:13px}#prompt:not([hidden]){background:white;padding:10px;border-radius:8px}.compact main{padding:8px}.compact #pipNote:not(:empty){display:block}.compact #lesson{padding:9px}.compact .signal{padding:10px}.compact #confirmed{margin:8px 0}@media(max-width:500px){main{padding:12px}header{padding:18px;min-height:130px}section{padding:14px}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.steps button,.steps button.active{font-size:16px;padding:9px;min-height:77px}}
header{justify-content:center;text-align:center}.headline{z-index:1}.headline p{font-size:clamp(18px,3.5vw,30px);margin:12px 0 6px;letter-spacing:-.035em}.headline .eyebrow{font-size:14px;letter-spacing:0}.cover-art{position:absolute;right:0;width:28%;opacity:.55;pointer-events:none}@media(max-width:600px){.cover-art{opacity:.17}}.choices{display:grid;gap:8px;margin:12px 0}.choice-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}.choices button{text-align:left;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.choices button[aria-pressed=true]{background:var(--lime);opacity:1}.results{list-style:none;padding:0}.results li{background:var(--soft);padding:8px 12px;border-radius:8px;overflow-wrap:anywhere}.results-summary{margin:8px 0}.choices input{min-width:0}</style></head><body><main><header><div class="headline"><h1>CUE FLOW</h1><p>읽는 순간, 보는 순간</p><span class="eyebrow">-학생용-</span></div><svg class="cover-art" viewBox="0 0 280 165" aria-hidden="true" focusable="false"><g fill="none" stroke="#cedbc5" opacity=".34"><circle cx="181" cy="81" r="73"/><circle cx="181" cy="81" r="56"/><path d="M93 81h179M181 0v164"/></g><g transform="rotate(-13 126 80)"><rect x="55" y="37" width="102" height="91" rx="19" fill="#f7ecde"/><path d="m76 105 28-48 31 48Z" fill="none" stroke="#213d34" stroke-width="4" stroke-linejoin="round"/><circle cx="104" cy="57" r="5" fill="#db7759"/></g><g transform="rotate(14 197 86)"><rect x="154" y="45" width="86" height="86" rx="20" fill="#d6ed9a"/><path d="M176 87l15 15 27-31" fill="none" stroke="#213d34" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M249 22v18m-9-9h18M39 116v14m-7-7h14" stroke="#e9b59e" stroke-width="3" stroke-linecap="round"/></svg></header><section id="setup"><h2>수업에 들어가요</h2><p class="muted">선생님이 알려준 연결 정보와 수업방 코드를 넣어 주세요.</p><textarea id="config" aria-label="Firebase 설정" placeholder='{"apiKey":"웹 API 키", "databaseURL":"https://데이터베이스주소"}'></textarea><label for="room">선생님이 알려준 수업방 코드</label><input id="room" placeholder="수업방 코드 붙여넣기" autocomplete="off"><label for="displayName">친구들이 부르는 이름이나 별명</label><input id="displayName" maxlength="30" autocomplete="off" required><button id="connect" class="primary">수업 들어가기</button></section><section id="connection"><div id="status" class="status" role="status">아직 연결되지 않았습니다.</div></section><p id="pipHome" role="status" hidden>작은 창에서 수업 신호를 표시 중입니다. 작은 창을 닫으면 이 화면으로 돌아옵니다.</p><section id="lesson" class="hidden"><button id="pip" type="button" hidden>작은 창으로 띄우기</button><p id="pipNote" class="muted" role="status"></p><div class="signal" aria-live="polite"><h2 id="title"></h2><p id="instruction"></p><p id="prompt" class="question" hidden></p></div><div id="answerChoices" class="choices" aria-label="문항 선택지"></div><button id="ack" class="primary">이해했어요</button><p id="confirmed" role="status"></p><button id="leave">수업방 나가기</button></section></main><script>let pipWindow=null;const $=id=>document.getElementById(id)||pipWindow?.document.getElementById(id);let cfg,token,uid,room,timer,started;const stages=[['💬 설명 확인','선생님의 설명과 자막에서 핵심을 확인해요.'],['👀 변화 관찰','이제 칠판을 볼 차례예요. 선생님이 보여주는 화면을 보며 달라지는 것과 그대로인 것을 찾아봐요.'],['✋ 직접 해보기','알지오매스에서 직접 도형을 움직여 봐요. 예상과 실제 결과가 같은지 살펴봐요.'],['✓ 이해 확인','선생님이 보낸 질문을 읽어요. 잘 생각해서 답을 하나 고르고, 잘 모르겠다면 ‘잘 모르겠어요’ 버튼을 눌러 주세요.']];function msg(t){$('status').textContent=t;}function fail(e){msg('연결 오류: '+e.message+'\n설정·익명 로그인·데이터베이스 규칙·네트워크를 확인하세요.');}async function login(){cfg=JSON.parse($('config').value);if(!cfg.apiKey||!/^https:\/\/[a-zA-Z0-9.-]+(?:firebaseio.com|firebasedatabase.app)\/?$/.test(cfg.databaseURL))throw Error('apiKey와 올바른 Firebase databaseURL을 입력하세요.');cfg.databaseURL=cfg.databaseURL.replace(/\/$/,'');const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+encodeURIComponent(cfg.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});const d=await r.json();if(!r.ok)throw Error(d.error?.message||'익명 로그인 실패');token=d.idToken;uid=d.localId;started=Date.now();}async function db(path,method='GET',body,etag){const r=await fetch(cfg.databaseURL+'/rooms/'+room+(path?'/'+path:'')+'.json?auth='+encodeURIComponent(token),{method,headers:{'Content-Type':'application/json',...(etag===true?{'X-Firebase-ETag':'true'}:etag?{'If-Match':etag}:{})},...(body===undefined?{}:{body:JSON.stringify(body)})});const d=await r.json();if(!r.ok)throw Error(d?.error||'데이터 요청 실패');return etag===true?[d,r.headers.get("ETag")]:d;}let busy=false,polling=false,state=null; const LIVE=60000;
function poll(){timer=setInterval(()=>{if(!busy&&!polling)sync();},2000);}
async function sync(){polling=true;try{if(Date.now()-started>2700000){clearInterval(timer);throw Error('45분 연결이 끝났습니다. 페이지를 다시 열어 주세요.');}const d=await db('');if(!d)throw Error('수업방이 종료되었습니다.');await render(d);msg('수업방 연결됨');}catch(e){state=null;fail(e);lock();}finally{polling=false;}}
function show(d){state=d;const item=d.step===4?['수업 완료','모든 수업 단계를 마쳤습니다.']:stages[d.step];$('title').textContent=item[0];$('instruction').textContent=item[1];}
function openLesson(){ $('setup').hidden=true;$('lesson').classList.remove('hidden');}
async function action(fn){if(busy||polling)return;busy=true;lock();try{await fn();}catch(e){fail(e);const status=$('status').textContent; if($('confirmed'))$('confirmed').textContent=status; if($('gate'))$('gate').textContent=status;}finally{busy=false;lock();}}
let lastBeat=0,displayName='',choiceStamp='';
function options(d,own){const list=d.step===3?(d.quiz?.choices||[]):[];const selected=own?.rev===d.rev?own.choice:undefined;const stamp=JSON.stringify([d.rev,list,selected]);$('ack').hidden=!!list.length;if(stamp!==choiceStamp){choiceStamp=stamp;$('answerChoices').replaceChildren(...list.concat(d.step===3&&d.question?['잘 모르겠어요']:[]).map((text,i)=>{const b=document.createElement('button');b.type='button';const value=i===list.length?0:i+1;b.textContent=value?`${value}번 · ${text}`:text;b.setAttribute('aria-pressed',String(selected===value));b.onclick=()=>action(()=>submit(value));return b;}));}}

function lock(){const own=state?.acks?.[uid];$('answerChoices').querySelectorAll('button').forEach(b=>b.disabled=busy||!state||(own?.rev===state.rev&&(!state.quiz?.choices?.length||Number.isInteger(own.choice)))); $('ack').disabled=busy||!state||state.step>=4||(state.step===3&&!state.question)||state.acks?.[uid]?.rev===state.rev; }
async function render(d){show(d);const own=d.acks?.[uid];if(!own||Date.now()-lastBeat>15000){const rev=own?.rev||0;await db('acks/'+uid,'PUT',{...own,rev,displayName,seen:{'.sv':'timestamp'}});lastBeat=Date.now();} options(d,own); $('prompt').hidden=d.step!==3||!d.question;$('prompt').textContent=d.question||'';$('confirmed').textContent=d.step===4?'수업이 완료되었습니다.':d.step===3&&!d.question?'교사가 문항을 보내기를 기다려 주세요.':own?.rev===d.rev?(own.choice===0?'✓ 잘 모르겠어요를 보냈어요.':own.choice?'✓ '+own.choice+'번 응답을 보냈어요.':'✓ 확인을 보냈어요. 기다려 주세요.'):d.quiz?.choices?.length&&d.step===3?'누르면 바로 제출돼요. 선택지를 하나 골라 주세요.':'내용을 확인한 뒤 눌러 주세요.';lock();}
$('connect').onclick=async()=>{ $('connect').disabled=true;try{displayName=$('displayName').value.trim();if(!displayName)throw Error('이름 또는 수업용 별칭을 입력하세요.');room=$('room').value.trim();if(!/^[a-f0-9]{32}$/.test(room))throw Error('32자리 수업방 코드를 확인하세요.');await login();const d=await db('');if(!d)throw Error('수업방이 없거나 종료되었습니다.');await render(d);openLesson();msg('수업방 연결됨');poll();}catch(e){state=null;fail(e);$('connect').disabled=false;}};
async function submit(choice){const rev=state.rev;const d=await db('');if(!d||d.rev!==rev||(d.step===3&&!d.question)||d.step>=4)throw Error('신호가 바뀌었습니다. 새 신호를 확인해 주세요.');const choices=d.step===3?(d.quiz?.choices||[]):[];if(!(choice===0&&d.step===3)&&(choices.length?(!Number.isInteger(choice)||choice<1||choice>choices.length):choice!==undefined))throw Error('선택지를 다시 확인하세요.');if(d.acks?.[uid]?.rev===rev&&(!choices.length||Number.isInteger(d.acks[uid].choice))){await render(d);return;}const record={rev,displayName,...(choice===undefined?{}:{choice})};await db('acks/'+uid,'PUT',{...record,seen:{'.sv':'timestamp'}});lastBeat=Date.now();(d.acks??={})[uid]=record;await render(d);}
$('ack').onclick=()=>action(()=>submit());
const pipApi=window.documentPictureInPicture;
if(pipApi){$('pip').hidden=false;}else{$('pipNote').textContent='이 브라우저에서는 작은 창 띄우기를 지원하지 않아요. 현재 화면에서 수업을 이어가 주세요.';}
$('pip').onclick=async()=>{
 if(pipWindow){pipWindow.close();return;}
 const lesson=$('lesson'),parent=lesson.parentNode,anchor=lesson.nextSibling;
 $('pip').disabled=true;
 try{
  const w=await pipApi.requestWindow({width:390,height:430});
  pipWindow=w;
  w.addEventListener('pagehide',()=>{if(pipWindow!==w)return;parent.insertBefore(lesson,anchor);pipWindow=null;$('pipHome').hidden=true;$('pip').textContent='작은 창으로 띄우기';},{once:true});
  w.document.title='CUE FLOW · 학생용';w.document.documentElement.lang='ko';
  w.document.head.append(document.querySelector('style').cloneNode(true));
  w.document.body.classList.add('compact');
  const shell=w.document.createElement('main');w.document.body.append(shell);shell.append(lesson);
  $('pipHome').hidden=false;$('pip').textContent='원래 창으로 돌아가기';$('pipNote').textContent='';
 }catch{$('pipNote').textContent='작은 창을 열지 못했어요. 현재 화면에서 수업을 이어가 주세요.';}
 finally{$('pip').disabled=false;}
};
$('leave').onclick=()=>action(async()=>{await db('acks/'+uid,'DELETE');clearInterval(timer);state=null;if(pipWindow)pipWindow.close();$('lesson').classList.add('hidden');$('setup').hidden=false;$('connect').disabled=false;msg('수업방에서 나왔습니다.');});
</script></body></html>
